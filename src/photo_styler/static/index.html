<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Styler</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div><strong>PHOTO STYLER</strong> // LOCAL IMAGE LAB</div>
      <span>LOCAL IMAGE PROCESSING</span>
    </header>
    <main>
      <aside>
        <section>
          <h2>01 // IMAGE</h2>
          <label class="file-picker">
            <span id="file-label">Bild auswählen</span>
            <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" />
          </label>
        </section>
        <section>
          <h2>02 // PRESET</h2>
          <div class="row">
            <select id="preset-select" aria-label="Preset"></select>
            <button id="load-preset">Laden</button>
          </div>
          <div class="row">
            <input id="preset-name" type="text" maxlength="80" placeholder="Preset-Name" />
            <button id="save-preset">Speichern</button>
          </div>
        </section>
        <section id="controls">
          <h2>03 // FILTER</h2>
          <label>Kontrast <output data-for="contrast"></output><input name="contrast" type="range" min="0.1" max="3" step="0.05" /></label>
          <label>Helligkeit <output data-for="brightness"></output><input name="brightness" type="range" min="0.1" max="2" step="0.05" /></label>
          <label>Gamma <output data-for="gamma"></output><input name="gamma" type="range" min="0.2" max="3" step="0.05" /></label>
          <label>Scanlines <output data-for="scanline_opacity"></output><input name="scanline_opacity" type="range" min="0" max="0.8" step="0.01" /></label>
          <label>Scanline-Abstand <output data-for="scanline_spacing"></output><input name="scanline_spacing" type="range" min="2" max="20" step="1" /></label>
          <label>Vignette <output data-for="vignette_strength"></output><input name="vignette_strength" type="range" min="0" max="1" step="0.01" /></label>
          <label class="check"><input name="dithering" type="checkbox" /> Dithering</label>
          <div id="palette" class="palette"></div>
        </section>
        <section>
          <h2>04 // EXPORT</h2>
          <div class="row">
            <select id="output-format">
              <option value="webp">WebP</option>
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
            </select>
            <label class="quality">Qualität <input id="quality" type="number" min="1" max="100" /></label>
          </div>
          <button id="export" class="primary" disabled>VOLLAUFLÖSUNG SPEICHERN</button>
          <p>Der Export wird immer neu aus dem Originalbild berechnet.</p>
        </section>
      </aside>
      <section class="viewer">
        <div id="empty-state">SELECT AN IMAGE TO BEGIN</div>
        <div id="busy" hidden>RENDERING…</div>
        <img id="preview" alt="Gefilterte Vorschau" hidden />
        <footer id="status">READY // NO IMAGE LOADED</footer>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
